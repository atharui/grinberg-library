name: Publish Arabic library
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify the eight Arabic editions
        run: python3 migration/import_reader.py
      - name: Save the self-contained site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if ! git diff --cached --quiet; then
            git commit -m 'Import the Arabic reader and verified PDF editions'
            git push origin HEAD:main
          fi
      - name: Publish downloadable collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          edition=$(sha256sum migration/edition-20261126/books.json | cut -c1-12)
          label="الترجمة العربية المراجعة · $edition"
          asset="grinberg-arabic-books.zip"
          if gh release view arabic-edition >/dev/null 2>&1; then
            published=$(gh release view arabic-edition --json assets --jq '.assets[] | select(.name == "grinberg-arabic-books.zip") | .label')
            if [[ "$published" != "$label" ]]; then
              gh release upload arabic-edition "$asset#$label" --clobber
            fi
          else
            gh release create arabic-edition "$asset#$label" --title 'الكتب العربية الثمانية' --notes 'النسخ العربية المراجعة بصيغة PDF'
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
